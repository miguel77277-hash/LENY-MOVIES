name: LENY MOVIES - Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Buscar archivos APK
        run: |
          echo "Buscando archivos APK..."
          find . -type f -name "*.apk" -print
          echo "Buscando carpetas de salida..."
          find . -type d -path "*/build/outputs/*" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: LENY-MOVIES-APK
          path: '**/*.apk'
          if-no-files-found: error
